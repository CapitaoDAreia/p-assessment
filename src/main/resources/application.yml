spring:
  application:
    name: pismo-assessment
  
  datasource:
    url: jdbc:postgresql://localhost:5432/pismo
    username: pismo
    password: pismo123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.pismo.assessment: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
