version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pismo-postgres
    environment:
      POSTGRES_DB: pismo
      POSTGRES_USER: pismo
      POSTGRES_PASSWORD: pismo123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pismo -d pismo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pismo-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pismo-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pismo
      SPRING_DATASOURCE_USERNAME: pismo
      SPRING_DATASOURCE_PASSWORD: pismo123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pismo-network

volumes:
  postgres_data:

networks:
  pismo-network:
    driver: bridge
